<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Konto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav id="mainNavbar"></nav>

<div class="container py-4">
    <h1 class="h3 mb-4">Mein Konto</h1>

    <h2 class="h5 mb-3">Accountdetails</h2>
    <button id="editBtn" class="btn btn-primary btn-sm mt-2">Bearbeiten</button>
    <div id="accountDetails"></div>


    <div id="accountForm" class="d-none">
        <div class="mb-3">
            <label>Anrede</label>
            <select id="form-salutation" class="form-select">
                <option value="">-</option>
                <option value="Herr">Herr</option>
                <option value="Frau">Frau</option>
            </select>
        </div>
        <div class="mb-3"><label>Vorname *</label><input id="form-firstname" class="form-control"></div>
        <div class="mb-3"><label>Nachname *</label><input id="form-lastname" class="form-control"></div>
        <div class="mb-3"><label>E-Mail *</label><input id="form-email" type="email" class="form-control"></div>
        <div class="mb-3"><label>Benutzername *</label><input id="form-username" class="form-control"></div>
        <div class="mb-3"><label>Adresse *</label><input id="form-address" class="form-control"></div>
        <div class="mb-3"><label>PLZ *</label><input id="form-zip" class="form-control"></div>
        <div class="mb-3"><label>Stadt *</label><input id="form-city" class="form-control"></div>
        <div class="mb-3">
            <label>Neue Zahlungsmethode hinzufügen</label>
            <div class="input-group">
                <input id="form-new-payment" class="form-control" placeholder="z.B. Kreditkarte">
                <button class="btn btn-outline-secondary" id="addPaymentBtn">Hinzufügen</button>
            </div>
            <ul id="form-payment-list" class="list-group mt-2"></ul>
        </div>
        <hr>
        <div class="mb-3">
            <label>Passwort zur Bestätigung *</label>
            <input id="form-password" type="password" class="form-control">
        </div>
        <button id="saveBtn" class="btn btn-success">Speichern</button>
        <button id="cancelBtn" class="btn btn-secondary ms-2">Abbrechen</button>
    </div>

    <h2 class="h5 mb-3">Meine Bestellungen</h2>

    <div id="messageBox" class="alert d-none" role="alert"></div>

    <div id="ordersList"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/account.js"></script>
</body>
</html>
