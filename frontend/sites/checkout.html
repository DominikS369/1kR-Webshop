<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellung abschließen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav id="mainNavbar"></nav>

<div class="container py-4">
    <h1 class="h3 mb-4">Bestellung abschließen</h1>

    <div id="messageBox" class="alert d-none" role="alert"></div>

    <div class="row g-4">
        <div class="col-lg-6">
            <h2 class="h5 mb-3">Deine Bestellung</h2>
            <div id="cartSummary"></div>
        </div>

        <div class="col-lg-6">
            <h2 class="h5 mb-3">Lieferadresse & Zahlung</h2>
            <form id="checkoutForm" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="firstname" class="form-label">Vorname *</label>
                        <input type="text" id="firstname" name="firstname" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="lastname" class="form-label">Nachname *</label>
                        <input type="text" id="lastname" name="lastname" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label for="address" class="form-label">Adresse *</label>
                        <input type="text" id="address" name="address" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="zip" class="form-label">PLZ *</label>
                        <input type="text" id="zip" name="zip" class="form-control" required>
                    </div>
                    <div class="col-md-8">
                        <label for="city" class="form-label">Ort *</label>
                        <input type="text" id="city" name="city" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label for="paymentMethod" class="form-label">Zahlungsart *</label>
                        <select id="paymentMethod" class="form-select" required>
                            <option value="">Bitte wählen</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success">Bestellung abschicken</button>
                    <a href="cart.html" class="btn btn-outline-secondary">Zurück zum Warenkorb</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/checkout.js"></script>
</body>
</html>
