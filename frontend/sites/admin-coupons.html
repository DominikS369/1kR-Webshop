<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutscheine verwalten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../res/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav id="mainNavbar"></nav>

<div class="page-container py-4 text-start">
    <h1 class="h3 mb-4">Gutscheine verwalten</h1>

    <div id="messageBox" class="alert d-none" role="alert"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Neuen Rabattcode erstellen</h2>
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label">Wunsch-Code (optional)</label>
                    <input type="text" id="couponCode" class="form-control" maxlength="50" placeholder="leer lassen für Zufallscode">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Rabatttyp</label>
                    <select id="discountType" class="form-select">
                        <option value="fixed">Fixer Betrag (€)</option>
                        <option value="percentage">Prozent (%)</option>
                    </select>
                    </div>
                <div class="col-md-4">
                    <label class="form-label">Wert</label>
                    <input type="number" id="discountValue" class="form-control" min="0.01" step="0.01" placeholder="z.B. 10">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ablaufdatum</label>
                    <input type="date" id="expiresAt" class="form-control">
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-dark btn-sm" onclick="createCoupon()">Gutschein generieren</button>
                </div>
                </div>
            </div>
            </div>

    <table class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>Code</th>
            <th>Typ</th>
            <th>Wert</th>
            <th>Ablaufdatum</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody id="couponTable"></tbody>
    </table>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/admin-coupons.js"></script>
</body>
</html>
