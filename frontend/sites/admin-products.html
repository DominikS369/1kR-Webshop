<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkte bearbeiten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../res/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav id="mainNavbar"></nav>

<div class="page-container py-4 text-start">
    <h1 class="h3 mb-4">Produkte bearbeiten</h1>

    <div id="messageBox" class="alert d-none" role="alert"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Neues Produkt anlegen</h2>
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label mb-1">Name *</label>
                    <input id="new-name" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label mb-1">Preis (€) *</label>
                    <input id="new-price" class="form-control" type="number" step="0.01" min="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label mb-1">Kategorie *</label>
                    <select id="new-category" class="form-select"></select>
                </div>
                <div class="col-12">
                    <label class="form-label mb-1">Beschreibung</label>
                    <textarea id="new-description" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label mb-1">Bild (optional)</label>
                    <input id="new-image" type="file" class="form-control" accept="image/png,image/jpeg,image/webp,image/gif">
                </div>
                <div class="col-12 text-end">
                    <button id="createBtn" class="btn btn-dark btn-sm">Produkt anlegen</button>
                </div>
            </div>
        </div>
    </div>

    <div id="adminProductList"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/admin-products.js"></script>
</body>
</html>
